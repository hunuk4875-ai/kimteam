<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ 킴성태팀 내실 현황판 (실시간 연동)</title>
    <!-- Firebase SDK (v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJVUFi2vg_zh2EkN5YnCNqwVbwiocVY14",
            authDomain: "kimteam-db.firebaseapp.com",
            databaseURL: "https://kimteam-db-default-rtdb.firebaseio.com",
            projectId: "kimteam-db",
            storageBucket: "kimteam-db.firebasestorage.app",
            messagingSenderId: "1073341919570",
            appId: "1:1073341919570:web:57632de373dbe61ef44a8b",
            measurementId: "G-Q5EZ3MJHBX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbOnValue = onValue;
    </script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --box-bg: #0f172a;
            --box-border: #475569;
            --text-gold: #fbbf24;
            --text-light: #f8fafc;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bar {
            width: 100%;
            max-width: 1600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
            padding: 16px 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--box-border);
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: bold;
        }

        .badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: normal;
        }

        .badge-view { background: #334155; color: #94a3b8; }
        .badge-edit { background: #065f46; color: #34d399; }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-lock { background-color: #475569; }
        .btn-add { background-color: var(--success); }
        .btn-col { background-color: #8b5cf6; }
        .btn-pw { background-color: #6366f1; }

        .board-container {
            width: 100%;
            max-width: 1600px;
            background-color: var(--panel-bg);
            border: 1px solid var(--box-border);
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 6px 10px;
            text-align: center;
        }

        th {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-gold);
            padding: 0;
            min-width: 90px;
        }

        th .th-box {
            background-color: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 6px;
            height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
            position: relative;
        }

        th input {
            color: var(--text-gold);
            font-weight: bold;
            text-align: center;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.88rem;
        }

        .col-btn-group {
            display: none;
            gap: 2px;
            margin-top: 2px;
        }

        .editable .col-btn-group { display: flex; }

        .btn-col-mv {
            background: #334155;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 0 4px;
            font-size: 0.65rem;
            cursor: pointer;
        }

        .btn-col-mv:hover { background: #475569; }

        .btn-col-del {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 3px;
            padding: 0 4px;
            font-size: 0.65rem;
            cursor: pointer;
        }

        td {
            padding: 0;
            vertical-align: middle;
        }

        .td-box {
            background-color: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 6px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        td input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-light);
            text-align: center;
            font-size: 0.92rem;
            outline: none;
        }

        .profile-wrap {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #1e293b;
            border: 1px dashed var(--box-border);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        .profile-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-wrap span {
            font-size: 0.65rem;
            color: #64748b;
            text-align: center;
        }

        .file-input { display: none; }

        .btn-action-group {
            display: flex;
            gap: 2px;
            width: 100%;
            height: 100%;
        }

        .btn-move {
            background: #334155;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 0 6px;
        }

        .btn-move:hover { background: #475569; }

        .btn-del {
            background: var(--danger);
            color: white;
            border: none;
            flex: 1;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="title-area">
            🛡️ 킴성태팀 내실 현황판
            <span id="modeBadge" class="badge badge-view">🔒 읽기 전용</span>
        </div>
        <div class="btn-group">
            <button id="authBtn" class="btn btn-lock" onclick="toggleAuth()">🔓 수정 권한 얻기</button>
            <button id="addColBtn" class="btn btn-col" style="display:none;" onclick="addColumn()">+ 항목(열) 추가</button>
            <button id="addBtn" class="btn btn-add" style="display:none;" onclick="addRow()">+ 팀원 추가</button>
            <button id="saveBtn" class="btn" style="display:none;" onclick="saveData()">💾 저장하기</button>
            <button class="btn btn-pw" onclick="changePw()">🔑 비번 변경</button>
        </div>
    </div>

    <div class="board-container">
        <table id="mainTable">
            <thead>
                <tr id="headerRow"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        let isEdit = false;
        const DEFAULT_PW = "1234";

        let columns = [
            { id: "c1", title: "팀원명", width: "100px" },
            { id: "c2", title: "직업", width: "90px" },
            { id: "c3", title: "무기강화", width: "75px" },
            { id: "c4", title: "방어구강화", width: "75px" },
            { id: "c5", title: "체력", width: "70px" },
            { id: "c6", title: "내공", width: "70px" },
            { id: "c7", title: "회피", width: "70px" },
            { id: "c8", title: "운", width: "70px" },
            { id: "c9", title: "비고", width: "180px" }
        ];

        const defaultMembers = [
            { img: "", c1: "킴성태", c2: "나이트", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "팀장 / 메인 탱커" },
            { img: "", c1: "오아", c2: "위자드", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "메인 힐러" },
            { img: "", c1: "도현", c2: "워리어", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "근접 딜러" },
            { img: "", c1: "김진솔", c2: "어쌔신", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "기동성 암살" },
            { img: "", c1: "중력", c2: "헌터", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "원거리 범위딜" },
            { img: "", c1: "수피", c2: "헌터", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "원거리 범딜 지원" },
            { img: "", c1: "표우", c2: "위자드", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "서브 힐러" },
            { img: "", c1: "김진아", c2: "어쌔신", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "근접 딜러" },
            { img: "", c1: "견자희", c2: "나이트", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "서브 탱커" },
            { img: "", c1: "라무", c2: "워리어", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "폭딜러" },
            { img: "", c1: "킴나니", c2: "위자드", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "지원가" },
            { img: "", c1: "망구", c2: "헌터", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "원거리 지원" }
        ];

        let membersData = [...defaultMembers];

        function getPw() {
            return localStorage.getItem('board_pw') || DEFAULT_PW;
        }

        function toggleAuth() {
            if (isEdit) {
                isEdit = false;
                updateUI();
            } else {
                const pw = prompt("비밀번호를 입력하세요 (기본: 1234):");
                if (pw === getPw()) {
                    isEdit = true;
                    alert("수정 권한이 활성화되었습니다.");
                    updateUI();
                } else if (pw !== null) {
                    alert("비밀번호가 틀렸습니다.");
                }
            }
        }

        function changePw() {
            const current = prompt("현재 비밀번호:");
            if (current === getPw()) {
                const next = prompt("새 비밀번호:");
                if (next && next.trim()) {
                    localStorage.setItem('board_pw', next.trim());
                    alert("비밀번호 변경 완료!");
                }
            } else if (current !== null) {
                alert("현재 비밀번호 오류.");
            }
        }

        function updateUI() {
            const badge = document.getElementById('modeBadge');
            const authBtn = document.getElementById('authBtn');
            const addBtn = document.getElementById('addBtn');
            const addColBtn = document.getElementById('addColBtn');
            const saveBtn = document.getElementById('saveBtn');
            const table = document.getElementById('mainTable');

            if (isEdit) {
                badge.innerText = "✏️ 수정 모드";
                badge.className = "badge badge-edit";
                authBtn.innerText = "🔒 수정 잠그기";
                addBtn.style.display = "inline-block";
                addColBtn.style.display = "inline-block";
                saveBtn.style.display = "inline-block";
                table.classList.add('editable');
            } else {
                badge.innerText = "🔒 읽기 전용";
                badge.className = "badge badge-view";
                authBtn.innerText = "🔓 수정 권한 얻기";
                addBtn.style.display = "none";
                addColBtn.style.display = "none";
                saveBtn.style.display = "none";
                table.classList.remove('editable');
            }

            renderAll();
        }

        function syncInputsToData() {
            // 현재 입력 중인 항목(열) 제목 동기화
            document.querySelectorAll('#headerRow input').forEach(inp => {
                const colId = inp.dataset.colid;
                const colObj = columns.find(c => c.id === colId);
                if (colObj) colObj.title = inp.value;
            });

            // 현재 입력 중인 팀원 데이터 동기화
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach((r, idx) => {
                if (!membersData[idx]) return;
                r.querySelectorAll('input[type="text"]').forEach(inp => {
                    const colId = inp.dataset.colid;
                    if (colId) membersData[idx][colId] = inp.value;
                });
            });
        }

        function addColumn() {
            if (!isEdit) return;
            syncInputsToData();
            const title = prompt("새로 추가할 항목(열)의 이름을 입력하세요:", "새 항목");
            if (!title) return;

            const newId = "col_" + Date.now();
            columns.push({ id: newId, title: title.trim(), width: "90px" });

            membersData.forEach(m => {
                if (m[newId] === undefined) m[newId] = "";
            });

            renderAll();
        }

        function delColumn(colId) {
            if (!isEdit) return;
            if (confirm("이 항목(열) 전체를 삭제하시겠습니까?")) {
                syncInputsToData();
                columns = columns.filter(c => c.id !== colId);
                renderAll();
            }
        }

        function moveColumn(colIdx, dir) {
            if (!isEdit) return;
            syncInputsToData();

            const targetIdx = colIdx + dir;
            if (targetIdx < 0 || targetIdx >= columns.length) return;

            const temp = columns[colIdx];
            columns[colIdx] = columns[targetIdx];
            columns[targetIdx] = temp;

            renderAll();
        }

        function moveRow(idx, dir) {
            if (!isEdit) return;
            syncInputsToData();

            const targetIdx = idx + dir;
            if (targetIdx < 0 || targetIdx >= membersData.length) return;

            const temp = membersData[idx];
            membersData[idx] = membersData[targetIdx];
            membersData[targetIdx] = temp;

            renderBody();
        }

        function renderAll() {
            renderHeader();
            renderBody();
        }

        function renderHeader() {
            const tr = document.getElementById('headerRow');
            tr.innerHTML = `<th style="width: 55px;"><div class="th-box">프로필</div></th>`;

            columns.forEach((col, idx) => {
                const th = document.createElement('th');
                th.style.width = col.width || "90px";
                th.innerHTML = `
                    <div class="th-box">
                        <input type="text" data-colid="${col.id}" value="${col.title}" ${!isEdit ? 'readonly' : ''}>
                        <div class="col-btn-group">
                            <button class="btn-col-mv" onclick="moveColumn(${idx}, -1)">◀</button>
                            <button class="btn-col-mv" onclick="moveColumn(${idx}, 1)">▶</button>
                            <button class="btn-col-del" onclick="delColumn('${col.id}')">✕</button>
                        </div>
                    </div>
                `;
                tr.appendChild(th);
            });

            if (isEdit) {
                tr.innerHTML += `<th style="width: 100px;"><div class="th-box" style="color:var(--text-gold);">관리</div></th>`;
            }
        }

        function renderBody() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            membersData.forEach((m, idx) => {
                const tr = document.createElement('tr');
                let html = `
                    <td>
                        <div class="td-box">
                            <div class="profile-wrap" onclick="${isEdit ? `triggerFile(${idx})` : ''}">
                                ${m.img ? `<img src="${m.img}">` : `<span>사진</span>`}
                            </div>
                            <input type="file" id="f-${idx}" class="file-input" accept="image/*" onchange="uploadImg(event, ${idx})">
                        </div>
                    </td>
                `;

                columns.forEach(col => {
                    const val = m[col.id] || "";
                    const isName = (col.id === 'c1');
                    html += `
                        <td>
                            <div class="td-box">
                                <input type="text" data-colid="${col.id}" value="${val}" ${!isEdit ? 'readonly' : ''} style="${isName ? 'font-weight:bold;' : ''}">
                            </div>
                        </td>
                    `;
                });

                if (isEdit) {
                    html += `
                        <td>
                            <div class="td-box" style="padding:2px; border:none; background:transparent;">
                                <div class="btn-action-group">
                                    <button class="btn-move" onclick="moveRow(${idx}, -1)">▲</button>
                                    <button class="btn-move" onclick="moveRow(${idx}, 1)">▼</button>
                                    <button class="btn-del" onclick="delRow(this)">삭제</button>
                                </div>
                            </div>
                        </td>
                    `;
                }

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        function triggerFile(idx) {
            if (isEdit) document.getElementById(`f-${idx}`).click();
        }

        function uploadImg(e, idx) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.src = evt.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 100;
                        canvas.height = 100;
                        ctx.drawImage(img, 0, 0, 100, 100);
                        const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        
                        membersData[idx].img = resizedDataUrl;
                        renderBody();
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function addRow() {
            if (!isEdit) return;
            syncInputsToData();
            const newMember = { img: "" };
            columns.forEach(c => newMember[c.id] = (c.id === 'c1' ? '새 팀원' : '0'));
            membersData.push(newMember);
            renderBody();
        }

        function delRow(btn) {
            if (confirm("삭제하시겠습니까?")) {
                syncInputsToData();
                const tr = btn.closest('tr');
                const idx = Array.from(tr.parentNode.children).indexOf(tr);
                membersData.splice(idx, 1);
                renderBody();
            }
        }

        function saveData() {
            if (!isEdit) return;
            syncInputsToData();

            if (window.dbSet && window.dbRef) {
                window.dbSet(window.dbRef(window.db, 'dashboard_v2'), {
                    columns: columns,
                    members: membersData
                }).then(() => {
                    alert("서버에 모든 수정 내용이 성공적으로 저장되었습니다!");
                }).catch((err) => {
                    alert("저장 실패: " + err.message);
                });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateUI();

            const timer = setInterval(() => {
                if (window.dbOnValue && window.dbRef && window.db) {
                    clearInterval(timer);
                    window.dbOnValue(window.dbRef(window.db, 'dashboard_v2'), (snapshot) => {
                        const val = snapshot.val();
                        if (val) {
                            if (val.columns) columns = val.columns;
                            if (val.members) membersData = val.members;
                            renderAll();
                        } else {
                            renderAll();
                        }
                    });
                }
            }, 200);
        });
    </script>
</body>
</html>
