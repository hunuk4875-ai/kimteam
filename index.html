            justify-content: center;
            align-items: center;

</head>

            document.getElementById('pwInput').placeholder = "현재 비밀번호";
            document.getElementById('pwNewInput').style.display = "block";
            document.getElementById('pwNewInput').value = "";
            document.getElementById('customTabInput').style.display = "none";
            document.getElementById('pwModal').style.display = "flex";
            document.getElementById('pwInput').focus();
        }

        function openAddTabModal() {
            modalMode = 'addTab';
            document.getElementById('modalTitle').innerText = "➕ 새 탭 추가";
            document.getElementById('pwInput').style.display = "none";
            document.getElementById('pwNewInput').style.display = "none";
            document.getElementById('customTabInput').style.display = "block";
            document.getElementById('customTabInput').value = "";
            document.getElementById('pwModal').style.display = "flex";
            document.getElementById('customTabInput').focus();
        }

        function closeModal() {
            document.getElementById('pwModal').style.display = "none";
        }

        function handleModalKey(e) {
            if (e.key === 'Enter') submitModal();
            if (e.key === 'Escape') closeModal();
        }

        function submitModal() {
            if (modalMode === 'login') {
                const inputPw = document.getElementById('pwInput').value;
                if (inputPw === getPw()) {
                    isEdit = true;
                    closeModal();
                    updateUI();
                } else {
                    alert("비밀번호가 틀렸습니다.");
                }
            } else if (modalMode === 'change') {
                const inputPw = document.getElementById('pwInput').value;
                const newPw = document.getElementById('pwNewInput').value;
                if (inputPw === getPw()) {
                    if (newPw && newPw.trim()) {
                        localStorage.setItem('board_pw', newPw.trim());
                        alert("비밀번호가 성공적으로 변경되었습니다!");
                        closeModal();
                    } else {
                        alert("새 비밀번호를 입력해주세요.");
                    }
                } else {
                    alert("현재 비밀번호가 틀렸습니다.");
                }
            } else if (modalMode === 'addTab') {
                const tabName = document.getElementById('customTabInput').value;
                if (tabName && tabName.trim()) {
                    const newId = 'custom_' + Date.now();
                    customTabs.push({ id: newId, name: tabName.trim(), content: "새로 만든 탭의 내용을 입력하세요." });
                    activeTab = newId;
                    closeModal();
                    renderAll();
                } else {
                    alert("탭 이름을 입력해주세요.");
                }
            }
        }

        function toggleAuth() {
            if (isEdit) {
                isEdit = false;
                updateUI();
            } else {
                openLoginModal();
            }
        }

        function updateUI() {
            const badge = document.getElementById('modeBadge');
            const authBtn = document.getElementById('authBtn');
            const addBtn = document.getElementById('addBtn');
            const addColBtn = document.getElementById('addColBtn');
            const addTabBtn = document.getElementById('addTabBtn');
            const saveBtn = document.getElementById('saveBtn');
            const pwChangeBtn = document.getElementById('pwChangeBtn');

            if (isEdit) {
                badge.innerText = "✏️ 수정 모드";
                badge.className = "badge badge-edit";
                authBtn.innerText = "🔒 수정 잠그기";
                saveBtn.style.display = "inline-block";
                pwChangeBtn.style.display = "inline-block";
                addTabBtn.style.display = "inline-block";
                if (activeTab === 'spec' || activeTab === 'item') {
                    addBtn.style.display = "inline-block";
                    addColBtn.style.display = "inline-block";
                } else {
                    addBtn.style.display = "none";
                    addColBtn.style.display = "none";
                }
            } else {
                badge.innerText = "🔒 읽기 전용";
                badge.className = "badge badge-view";
                authBtn.innerText = "🔓 수정 권한 얻기";
                addBtn.style.display = "none";
                addColBtn.style.display = "none";
                addTabBtn.style.display = "none";
                saveBtn.style.display = "none";
                pwChangeBtn.style.display = "none";
            }

            renderTabBar();
            renderAll();
        }

        function syncInputsToData() {
            if (activeTab === 'spec' || activeTab === 'item') {
                const cols = getCurrentColumns();
                const headerInputs = document.querySelectorAll('#headerRow input');
                headerInputs.forEach(inp => {
                    const colId = inp.dataset.colid;
                    const colObj = cols.find(c => c.id === colId);
                    if (colObj) colObj.title = inp.value;
                });

                const rows = document.querySelectorAll('#tableBody tr');
                rows.forEach((r, idx) => {
                    if (!membersData[idx]) return;
                    r.querySelectorAll('input[type="text"], select').forEach(inp => {
                        const colId = inp.dataset.colid;
                        if (colId) membersData[idx][colId] = inp.value;
                    });
                });
            } else if (activeTab === 'map') {
                mapImages.forEach((item, idx) => {
                    const titleElem = document.getElementById(`map_title_${idx}`);
                    const memoElem = document.getElementById(`map_memo_${idx}`);
                    if (titleElem) item.title = titleElem.value;
                    if (memoElem) item.memo = memoElem.value;
                });
            } else if (activeTab === 'hidden') {
                hiddenJobsData.forEach((job, idx) => {
                    const nameElem = document.getElementById(`hidden_name_${idx}`);
                    const memoElem = document.getElementById(`hidden_memo_${idx}`);
                    if (nameElem) job.name = nameElem.value;
                    if (memoElem) job.memo = memoElem.value;
                });
            } else {
                const txtArea = document.getElementById('customTextArea');
                if (txtArea) {
                    const found = customTabs.find(t => t.id === activeTab);
                    if (found) found.content = txtArea.value;
                }
            }
        }

        // ★ 탭 이름 변경 및 렌더링 로직 추가
        function renderTabBar() {
            const tabBar = document.getElementById('tabBar');
            
            // 기본 탭 빌더 헬퍼
            const createDefaultTabHtml = (id, label) => `
                <div class="tab-btn-wrap">
                    <button class="tab-btn ${activeTab === id ? 'active' : ''}" onclick="switchTab('${id}')">${label}</button>
                </div>
            `;

            let html = createDefaultTabHtml('spec', '⚔️ 스펙 현황') +
                       createDefaultTabHtml('item', '📦 아이템 현황') +
                       createDefaultTabHtml('map', '🗺️ 맵 탭') +
                       createDefaultTabHtml('hidden', '🕵️ 히든추리 탭');

            // 커스텀 탭 렌더링 (수정 모드일 때 더블클릭으로 이름 변경 가능)
            customTabs.forEach(t => {
                const isActive = activeTab === t.id;
                html += `
                    <div class="tab-btn-wrap ${isEdit ? 'editable-tabs' : ''}">
                        <button class="tab-btn ${isActive ? 'active' : ''}" 
                                onclick="switchTab('${t.id}')" 
                                ondblclick="${isEdit ? `enableTabRename('${t.id}')` : ''}" 
                                title="${isEdit ? '더블클릭하여 탭 이름 변경' : ''}">${t.name}</button>
                        <button class="tab-del-btn" onclick="deleteCustomTab('${t.id}')" title="탭 삭제">✕</button>
                    </div>
                `;
            });

            tabBar.innerHTML = html;
        }

        // 탭 이름 변경 활성화 함수
        function enableTabRename(tabId) {
            if (!isEdit) return;
            const found = customTabs.find(t => t.id === tabId);
            if (!found) return;

            const tabBar = document.getElementById('tabBar');
            const wrappers = tabBar.querySelectorAll('.tab-btn-wrap');
            
            wrappers.forEach(wrap => {
                const btn = wrap.querySelector('.tab-btn');
                if (btn && btn.getAttribute('onclick')?.includes(tabId)) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'tab-input';
                    input.value = found.name;

                    wrap.replaceChild(input, btn);
                    input.focus();
                    input.select();

                    const saveName = () => {
                        const newName = input.value.trim();
                        if (newName) {
                            found.name = newName;
                        }
                        renderTabBar();
                    };

                    input.onkeydown = (e) => {
                        if (e.key === 'Enter') saveName();
                    };
                    input.onblur = saveName;
                }
            });
        }

        function deleteCustomTab(tabId) {
            if (!isEdit) return;
            if (confirm("이 탭을 삭제하시겠습니까?")) {
                customTabs = customTabs.filter(t => t.id !== tabId);
                if (activeTab === tabId) activeTab = 'spec';
                renderTabBar();
                renderAll();
            }
        }

        function renderAll() {
            renderTabBar();
            const container = document.getElementById('boardContainer');
            const addBtn = document.getElementById('addBtn');
            const addColBtn = document.getElementById('addColBtn');

            if (activeTab === 'spec' || activeTab === 'item') {
                if (isEdit) {
                    addBtn.style.display = "inline-block";
                    addColBtn.style.display = "inline-block";
                    container.classList.add('editable');
                } else {
                    addBtn.style.display = "none";
                    addColBtn.style.display = "none";
                    container.classList.remove('editable');
                }

                container.innerHTML = `
                    <table id="mainTable">
                        <thead><tr id="headerRow"></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                `;
                renderHeader();
                renderBody();
            } else if (activeTab === 'map') {
                addBtn.style.display = "none";
                addColBtn.style.display = "none";
                container.classList.remove('editable');
                renderMapTab(container);
            } else if (activeTab === 'hidden') {
                addBtn.style.display = "none";
                addColBtn.style.display = "none";
                container.classList.remove('editable');
                renderHiddenTab(container);
            } else {
                addBtn.style.display = "none";
                addColBtn.style.display = "none";
                container.classList.remove('editable');
                renderCustomTab(container);
            }
        }

        function renderMapTab(container) {
            let cardsHtml = '';
            mapImages.forEach((item, idx) => {
                cardsHtml += `
                    <div class="img-card">
                        <input type="text" id="map_title_${idx}" value="${item.title}" ${!isEdit ? 'readonly' : ''} placeholder="맵/지역 이름">
                        <div class="img-card-preview" onclick="${isEdit ? `triggerMapFile(${idx})` : ''}">
                            ${item.img ? `<img src="${item.img}">` : `<span>${isEdit ? '+ 스크린샷/사진 업로드' : '사진 없음'}</span>`}
                        </div>
                        <input type="file" id="map_file_${idx}" class="file-input" accept="image/*" onchange="uploadMapImg(event, ${idx})">
                        <textarea id="map_memo_${idx}" ${!isEdit ? 'readonly' : ''} placeholder="메모를 입력하세요">${item.memo}</textarea>
                    </div>
                `;
            });
            container.innerHTML = `
                <div class="section-box">
                    <h3 style="color:var(--text-gold); margin-bottom:10px;">🗺️ 맵 및 지역 정보 현황</h3>
                    <div class="img-upload-grid">${cardsHtml}</div>
                </div>
            `;
        }

        function renderHiddenTab(container) {
            let cardsHtml = '';
            hiddenJobsData.forEach((job, idx) => {
                cardsHtml += `
                    <div class="img-card">
                        <input type="text" id="hidden_name_${idx}" value="${job.name}" ${!isEdit ? 'readonly' : ''} placeholder="히든직업 이름">
                        <div class="img-card-preview" onclick="${isEdit ? `triggerHiddenFile(${idx})` : ''}">
                            ${job.img ? `<img src="${job.img}">` : `<span>${isEdit ? '+ 단서 이미지 업로드' : '사진 없음'}</span>`}
                        </div>
                        <input type="file" id="hidden_file_${idx}" class="file-input" accept="image/*" onchange="uploadHiddenImg(event, ${idx})">
                        <textarea id="hidden_memo_${idx}" ${!isEdit ? 'readonly' : ''} placeholder="전직 조건 및 단서 입력">${job.memo}</textarea>
                    </div>
                `;
            });
            container.innerHTML = `
                <div class="section-box">
                    <h3 style="color:var(--text-gold); margin-bottom:10px;">🕵️ 히든직업 추리 및 단서</h3>
                    <div class="img-upload-grid">${cardsHtml}</div>
                </div>
            `;
        }

        function renderCustomTab(container) {
            const found = customTabs.find(t => t.id === activeTab);
            const content = found ? found.content : "";
            container.innerHTML = `
                <div class="section-box">
                    <h3 style="color:var(--text-gold); margin-bottom:10px;">📄 ${found ? found.name : '커스텀 탭'}</h3>
                    <textarea id="customTextArea" style="width:100%; height:300px; background:var(--box-bg); color:var(--text-light); border:1px solid var(--box-border); padding:12px; border-radius:6px; outline:none; resize:vertical;" ${!isEdit ? 'readonly' : ''}>${content}</textarea>
                </div>
            `;
        }

        function renderHeader() {
            const headerRow = document.getElementById('headerRow');
            const cols = getCurrentColumns();
            let html = `<th style="width: 70px;"><div class="th-box">프로필</div></th>`;

            cols.forEach((col, index) => {
                html += `
                    <th style="width: ${col.width};">
                        <div class="th-box">
                            <input type="text" value="${col.title}" data-colid="${col.id}" ${!isEdit ? 'readonly' : ''}>
                            ${isEdit ? `
                                <div class="col-btn-group">
                                    <button class="btn-col-mv" onclick="moveColumn(${index}, -1)">◀</button>
                                    <button class="btn-col-del" onclick="deleteColumn('${col.id}')">✕</button>
                                    <button class="btn-col-mv" onclick="moveColumn(${index}, 1)">▶</button>
                                </div>
                            ` : ''}
                        </div>
                    </th>
                `;
            });

            if (isEdit) {
                html += `<th style="width: 80px;"><div class="th-box">관리</div></th>`;
            }

            headerRow.innerHTML = html;
        }

        function renderBody() {
            const tableBody = document.getElementById('tableBody');
            const cols = getCurrentColumns();
            let html = '';

            membersData.forEach((row, rIdx) => {
                html += `<tr>`;
                
                // 프로필 사진 열
                html += `
                    <td>
                        <div class="td-box" style="width: 70px;">
                            <div class="profile-wrap" onclick="${isEdit ? `triggerFile(${rIdx})` : ''}">
                                ${row.img ? `<img src="${row.img}">` : `<span>사진</span>`}
                            </div>
                            <input type="file" id="file_${rIdx}" class="file-input" accept="image/*" onchange="uploadProfile(event, ${rIdx})">
                        </div>
                    </td>
                `;

                // 데이터 열
                cols.forEach(col => {
                    let val = row[col.id] !== undefined ? row[col.id] : "";
                    
                    if (col.id === 'c2') {
                        // 직업 선택 드롭다운 처리
                        let jobClass = "job-default";
                        if (val === "나이트") jobClass = "job-knight";
                        else if (val === "위자드") jobClass = "job-wizard";
                        else if (val === "워리어") jobClass = "job-warrior";
                        else if (val === "어쌔신") jobClass = "job-assassin";
                        else if (val === "헌터") jobClass = "job-hunter";

                        let optionsHtml = '';
                        JOB_LIST.forEach(j => {
                            optionsHtml += `<option value="${j}" ${val === j ? 'selected' : ''}>${j}</option>`;
                        });

                        html += `
                            <td>
                                <div class="td-box job-tag ${jobClass}" style="width: ${col.width};">
                                    <select class="job-select" data-colid="${col.id}" ${!isEdit ? 'disabled' : ''} onchange="onJobChange(this, ${rIdx})">
                                        ${optionsHtml}
                                    </select>
                                </div>
                            </td>
                        `;
                    } else {
                        html += `
                            <td>
                                <div class="td-box" style="width: ${col.width};">
                                    <input type="text" value="${val}" data-colid="${col.id}" ${!isEdit ? 'readonly' : ''}>
                                </div>
                            </td>
                        `;
                    }
                });

                // 관리(행 이동/삭제) 열
                if (isEdit) {
                    html += `
                        <td>
                            <div class="td-box" style="width: 80px;">
                                <div class="btn-action-group">
                                    <button class="btn-move" onclick="moveRow(${rIdx}, -1)">▲</button>
                                    <button class="btn-del" onclick="deleteRow(${rIdx})">✕</button>
                                    <button class="btn-move" onclick="moveRow(${rIdx}, 1)">▼</button>
                                </div>
                            </div>
                        </td>
                    `;
                }

                html += `</tr>`;
            });

            tableBody.innerHTML = html;
        }

        function onJobChange(selectEl, rIdx) {
            const val = selectEl.value;
            membersData[rIdx]['c2'] = val;
            renderBody();
        }

        function triggerFile(rIdx) {
            document.getElementById(`file_${rIdx}`).click();
        }

        function uploadProfile(e, rIdx) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                membersData[rIdx].img = event.target.result;
                renderBody();
            };
            reader.readAsDataURL(file);
        }

        function triggerMapFile(idx) {
            document.getElementById(`map_file_${idx}`).click();
        }

        function uploadMapImg(e, idx) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                mapImages[idx].img = event.target.result;
                renderAll();
            };
            reader.readAsDataURL(file);
        }

        function triggerHiddenFile(idx) {
            document.getElementById(`hidden_file_${idx}`).click();
        }

        function uploadHiddenImg(e, idx) {
            const file = fileInputCheck(e);
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                hiddenJobsData[idx].img = event.target.result;
                renderAll();
            };
            reader.readAsDataURL(file);
        }

        function fileInputCheck(e) {
            return e.target.files[0];
        }

        function addRow() {
            syncInputsToData();
            const newRow = { img: "", c1: "신규팀원", c2: "미정", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "", i1: "0", i2: "0", i3: "0", i4: "0", i5: "-", i6: "-", i7: "" };
            membersData.push(newRow);
            renderBody();
        }

        function deleteRow(rIdx) {
            syncInputsToData();
            if (confirm("정말 이 팀원을 삭제하시겠습니까?")) {
                membersData.splice(rIdx, 1);
                renderBody();
            }
        }

        function moveRow(rIdx, direction) {
            syncInputsToData();
            const targetIdx = rIdx + direction;
            if (targetIdx < 0 || targetIdx >= membersData.length) return;
            const temp = membersData[rIdx];
            membersData[rIdx] = membersData[targetIdx];
            membersData[targetIdx] = temp;
            renderBody();
        }

        function addColumn() {
            syncInputsToData();
            const cols = getCurrentColumns();
            const newId = (activeTab === 'spec' ? 'col_' : 'item_') + Date.now();
            cols.push({ id: newId, title: "새 항목", width: "90px" });
            membersData.forEach(m => m[newId] = "0");
            renderAll();
        }

        function deleteColumn(colId) {
            syncInputsToData();
            const cols = getCurrentColumns();
            if (cols.length <= 1) {
                alert("최소 1개 이상의 열이 있어야 합니다.");
                return;
            }
            if (confirm("이 열을 삭제하시겠습니까?")) {
                const idx = cols.findIndex(c => c.id === colId);
                if (idx !== -1) cols.splice(idx, 1);
                renderAll();
            }
        }

        function moveColumn(colIndex, direction) {
            syncInputsToData();
            const cols = getCurrentColumns();
            const targetIdx = colIndex + direction;
            if (targetIdx < 0 || targetIdx >= cols.length) return;
            const temp = cols[colIndex];
            cols[colIndex] = cols[targetIdx];
            cols[targetIdx] = temp;
            renderAll();
        }

        function saveData() {
            syncInputsToData();
            const payload = {
                specColumns,
                itemColumns,
                membersData,
                mapImages,
                hiddenJobsData,
                customTabs
            };

            window.dbSet(window.dbRef(window.db, 'kimteam_board_data'), payload)
                .then(() => {
                    alert("성공적으로 Firebase에 저장되었습니다!");
                })
                .catch((error) => {
                    alert("저장 실패: " + error.message);
                });
        }

        // 실시간 연동 리스너
        window.addEventListener('DOMContentLoaded', () => {
            window.dbOnValue(window.dbRef(window.db, 'kimteam_board_data'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.specColumns) specColumns = data.specColumns;
                    if (data.itemColumns) itemColumns = data.itemColumns;
                    if (data.membersData) membersData = data.membersData;
                    if (data.mapImages) mapImages = data.mapImages;
                    if (data.hiddenJobsData) hiddenJobsData = data.hiddenJobsData;
                    if (data.customTabs) customTabs = data.customTabs;
                    renderAll();
                }
            });
        });
    </script>
</body>
</html>
