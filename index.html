<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ 킴성태팀 내실 현황판 (실시간 연동)</title>
    <!-- Firebase SDK (v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // 사용자발급 Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyAJVUFi2vg_zh2EkN5YnCNqwVbwiocVY14",
            authDomain: "kimteam-db.firebaseapp.com",
            databaseURL: "https://kimteam-db-default-rtdb.firebaseio.com", // 기본 RTDB URL 자동생성규칙
            projectId: "kimteam-db",
            storageBucket: "kimteam-db.firebasestorage.app",
            messagingSenderId: "1073341919570",
            appId: "1:1073341919570:web:57632de373dbe61ef44a8b",
            measurementId: "G-Q5EZ3MJHBX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbOnValue = onValue;
    </script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --box-bg: #0f172a;
            --box-border: #475569;
            --text-gold: #fbbf24;
            --text-light: #f8fafc;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bar {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
            padding: 16px 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--box-border);
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: bold;
        }

        .badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: normal;
        }

        .badge-view { background: #334155; color: #94a3b8; }
        .badge-edit { background: #065f46; color: #34d399; }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-lock { background-color: #475569; }
        .btn-add { background-color: var(--success); }
        .btn-pw { background-color: #6366f1; }

        .board-container {
            width: 100%;
            max-width: 1400px;
            background-color: var(--panel-bg);
            border: 1px solid var(--box-border);
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 6px 10px;
            text-align: center;
        }

        th {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-gold);
            padding: 0;
        }

        th .th-box {
            background-color: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 6px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        th input {
            color: var(--text-gold);
            font-weight: bold;
            text-align: center;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.9rem;
        }

        td {
            padding: 0;
            vertical-align: middle;
        }

        .td-box {
            background-color: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 6px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        td input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-light);
            text-align: center;
            font-size: 0.92rem;
            outline: none;
        }

        .profile-wrap {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #1e293b;
            border: 1px dashed var(--box-border);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        .profile-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-wrap span {
            font-size: 0.65rem;
            color: #64748b;
            text-align: center;
        }

        .file-input { display: none; }

        .btn-del {
            background: var(--danger);
            color: white;
            border: none;
            width: 100%;
            height: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            display: none;
        }

        .editable .btn-del { display: block; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="title-area">
            🛡️ 킴성태팀 내실 현황판
            <span id="modeBadge" class="badge badge-view">🔒 읽기 전용</span>
        </div>
        <div class="btn-group">
            <button id="authBtn" class="btn btn-lock" onclick="toggleAuth()">🔓 수정 권한 얻기</button>
            <button id="addBtn" class="btn btn-add" style="display:none;" onclick="addRow()">+ 팀원 추가</button>
            <button id="saveBtn" class="btn" style="display:none;" onclick="saveData()">💾 저장하기</button>
            <button class="btn btn-pw" onclick="changePw()">🔑 비번 변경</button>
        </div>
    </div>

    <div class="board-container">
        <table id="mainTable">
            <thead>
                <tr>
                    <th style="width: 55px;"><div class="th-box">프로필</div></th>
                    <th style="width: 110px;"><div class="th-box"><input type="text" id="th1" value="팀원명" readonly></div></th>
                    <th style="width: 100px;"><div class="th-box"><input type="text" id="th2" value="직업" readonly></div></th>
                    <th style="width: 80px;"><div class="th-box"><input type="text" id="th3" value="무기강화" readonly></div></th>
                    <th style="width: 80px;"><div class="th-box"><input type="text" id="th4" value="방어구강화" readonly></div></th>
                    <th style="width: 75px;"><div class="th-box"><input type="text" id="th5" value="체력" readonly></div></th>
                    <th style="width: 75px;"><div class="th-box"><input type="text" id="th6" value="내공" readonly></div></th>
                    <th style="width: 75px;"><div class="th-box"><input type="text" id="th7" value="회피" readonly></div></th>
                    <th style="width: 75px;"><div class="th-box"><input type="text" id="th8" value="운" readonly></div></th>
                    <th><div class="th-box"><input type="text" id="th9" value="비고" readonly></div></th>
                    <th id="delTh" style="width: 60px; display:none;"><div class="th-box" style="color:var(--danger);">삭제</div></th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        let isEdit = false;
        const DEFAULT_PW = "1234";
        let currentBoardData = [];

        const defaultMembers = [
            { c1: "킴성태", c2: "나이트", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "팀장 / 메인 탱커", img: "" },
            { c1: "오아", c2: "위자드", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "메인 힐러", img: "" },
            { c1: "도현", c2: "워리어", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "근접 딜러", img: "" },
            { c1: "김진솔", c2: "어쌔신", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "기동성 암살", img: "" },
            { c1: "중력", c2: "헌터", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "원거리 범위딜", img: "" },
            { c1: "수피", c2: "헌터", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "원거리 범딜 지원", img: "" },
            { c1: "표우", c2: "위자드", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "서브 힐러", img: "" },
            { c1: "김진아", c2: "어쌔신", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "근접 딜러", img: "" },
            { c1: "견자희", c2: "나이트", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "서브 탱커", img: "" },
            { c1: "라무", c2: "워리어", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "폭딜러", img: "" },
            { c1: "킴나니", c2: "위자드", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "지원가", img: "" },
            { c1: "망구", c2: "헌터", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "원거리 지원", img: "" }
        ];

        function getPw() {
            return localStorage.getItem('board_pw') || DEFAULT_PW;
        }

        function toggleAuth() {
            if (isEdit) {
                isEdit = false;
                updateUI();
            } else {
                const pw = prompt("비밀번호를 입력하세요 (기본: 1234):");
                if (pw === getPw()) {
                    isEdit = true;
                    alert("수정 권한이 활성화되었습니다.");
                    updateUI();
                } else if (pw !== null) {
                    alert("비밀번호가 틀렸습니다.");
                }
            }
        }

        function changePw() {
            const current = prompt("현재 비밀번호:");
            if (current === getPw()) {
                const next = prompt("새 비밀번호:");
                if (next && next.trim()) {
                    localStorage.setItem('board_pw', next.trim());
                    alert("비밀번호 변경 완료!");
                }
            } else if (current !== null) {
                alert("현재 비밀번호 오류.");
            }
        }

        function updateUI() {
            const badge = document.getElementById('modeBadge');
            const authBtn = document.getElementById('authBtn');
            const addBtn = document.getElementById('addBtn');
            const saveBtn = document.getElementById('saveBtn');
            const delTh = document.getElementById('delTh');
            const table = document.getElementById('mainTable');

            if (isEdit) {
                badge.innerText = "✏️ 수정 모드";
                badge.className = "badge badge-edit";
                authBtn.innerText = "🔒 수정 잠그기";
                addBtn.style.display = "inline-block";
                saveBtn.style.display = "inline-block";
                delTh.style.display = "table-cell";
                table.classList.add('editable');
            } else {
                badge.innerText = "🔒 읽기 전용";
                badge.className = "badge badge-view";
                authBtn.innerText = "🔓 수정 권한 얻기";
                addBtn.style.display = "none";
                saveBtn.style.display = "none";
                delTh.style.display = "none";
                table.classList.remove('editable');
            }

            for (let i = 1; i <= 9; i++) {
                const inp = document.getElementById(`th${i}`);
                if (inp) {
                    if (isEdit) inp.removeAttribute('readonly');
                    else inp.setAttribute('readonly', 'true');
                }
            }

            render(currentBoardData);
        }

        function saveData() {
            if (!isEdit) return;

            const headers = {};
            for (let i = 1; i <= 9; i++) {
                headers[`th${i}`] = document.getElementById(`th${i}`).value;
            }

            const rows = document.querySelectorAll('#tableBody tr');
            const data = [];
            rows.forEach(r => {
                const img = r.querySelector('.profile-wrap img');
                data.push({
                    img: img ? img.src : '',
                    c1: r.cells[1].querySelector('input').value,
                    c2: r.cells[2].querySelector('input').value,
                    c3: r.cells[3].querySelector('input').value,
                    c4: r.cells[4].querySelector('input').value,
                    c5: r.cells[5].querySelector('input').value,
                    c6: r.cells[6].querySelector('input').value,
                    c7: r.cells[7].querySelector('input').value,
                    c8: r.cells[8].querySelector('input').value,
                    c9: r.cells[9].querySelector('input').value,
                });
            });

            // Firebase 실시간 DB로 저장
            if (window.dbSet && window.dbRef) {
                window.dbSet(window.dbRef(window.db, 'dashboard'), {
                    headers: headers,
                    members: data
                }).then(() => {
                    alert("서버에 성공적으로 저장되었습니다! 모든 사용자에게 적용됩니다.");
                }).catch((err) => {
                    alert("저장 실패 (Realtime Database 설정을 완료했는지 확인해주세요): " + err.message);
                });
            }
        }

        function render(dataList) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const data = (dataList && dataList.length > 0) ? dataList : defaultMembers;

            data.forEach((m, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="td-box">
                            <div class="profile-wrap" onclick="${isEdit ? `triggerFile(${idx})` : ''}">
                                ${m.img ? `<img src="${m.img}">` : `<span>사진</span>`}
                            </div>
                            <input type="file" id="f-${idx}" class="file-input" accept="image/*" onchange="uploadImg(event, ${idx})">
                        </div>
                    </td>
                    <td><div class="td-box"><input type="text" value="${m.c1||''}" ${!isEdit?'readonly':''} style="font-weight:bold;"></div></td>
                    <td><div class="td-box"><input type="text" value="${m.c2||''}" ${!isEdit?'readonly':''}></div></td>
                    <td><div class="td-box"><input type="text" value="${m.c3||'0'}" ${!isEdit?'readonly':''}></div></td>
                    <td><div class="td-box"><input type="text" value="${m.c4||'0'}" ${!isEdit?'readonly':''}></div></td>
                    <td><div class="td-box"><input type="text" value="${m.c5||'0'}" ${!isEdit?'readonly':''}></div></td>
                    <td><div class="td-box"><input type="text" value="${m.c6||'0'}" ${!isEdit?'readonly':''}></div></td>
                    <td><div class="td-box"><input type="text" value="${m.c7||'0'}" ${!isEdit?'readonly':''}></div></td>
                    <td><div class="td-box"><input type="text" value="${m.c8||'0'}" ${!isEdit?'readonly':''}></div></td>
                    <td><div class="td-box" style="justify-content:flex-start;"><input type="text" value="${m.c9||''}" ${!isEdit?'readonly':''} style="text-align:left; padding-left:8px;"></div></td>
                    ${isEdit ? `<td><div class="td-box" style="padding:0; border:none; background:transparent;"><button class="btn-del" onclick="delRow(this)">삭제</button></div></td>` : ''}
                `;
                tbody.appendChild(tr);
            });
        }

        function triggerFile(idx) {
            if (isEdit) document.getElementById(`f-${idx}`).click();
        }

        function uploadImg(e, idx) {
            const file = e.target.files[0];
            if (file) {
                // 이미지를 캔버스로 리사이징하여 데이터 크기 경량화 (실시간 연동 최적화)
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.src = evt.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 100;
                        canvas.height = 100;
                        ctx.drawImage(img, 0, 0, 100, 100);
                        const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        
                        const wrap = e.target.parentElement.querySelector('.profile-wrap');
                        wrap.innerHTML = `<img src="${resizedDataUrl}">`;
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function addRow() {
            if (!isEdit) return;
            const tbody = document.getElementById('tableBody');
            const idx = Date.now();
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="td-box">
                        <div class="profile-wrap" onclick="triggerFile(${idx})"><span>사진</span></div>
                        <input type="file" id="f-${idx}" class="file-input" accept="image/*" onchange="uploadImg(event, ${idx})">
                    </div>
                </td>
                <td><div class="td-box"><input type="text" value="" style="font-weight:bold;"></div></td>
                <td><div class="td-box"><input type="text" value=""></div></td>
                <td><div class="td-box"><input type="text" value="0"></div></td>
                <td><div class="td-box"><input type="text" value="0"></div></td>
                <td><div class="td-box"><input type="text" value="0"></div></td>
                <td><div class="td-box"><input type="text" value="0"></div></td>
                <td><div class="td-box"><input type="text" value="0"></div></td>
                <td><div class="td-box"><input type="text" value="0"></div></td>
                <td><div class="td-box" style="justify-content:flex-start;"><input type="text" value="" style="text-align:left; padding-left:8px;"></div></td>
                <td><div class="td-box" style="padding:0; border:none; background:transparent;"><button class="btn-del" style="display:block" onclick="delRow(this)">삭제</button></div></td>
            `;
            tbody.appendChild(tr);
        }

        function delRow(btn) {
            if (confirm("삭제하시겠습니까?")) {
                btn.closest('tr').remove();
            }
        }

        // Firebase 실시간 동기화 수신
        window.addEventListener('DOMContentLoaded', () => {
            updateUI();

            const timer = setInterval(() => {
                if (window.dbOnValue && window.dbRef && window.db) {
                    clearInterval(timer);
                    window.dbOnValue(window.dbRef(window.db, 'dashboard'), (snapshot) => {
                        const val = snapshot.val();
                        if (val) {
                            if (val.headers) {
                                for (let i = 1; i <= 9; i++) {
                                    const inp = document.getElementById(`th${i}`);
                                    if (inp && val.headers[`th${i}`]) inp.value = val.headers[`th${i}`];
                                }
                            }
                            if (val.members) {
                                currentBoardData = val.members;
                                render(currentBoardData);
                            }
                        } else {
                            render(defaultMembers);
                        }
                    });
                }
            }, 200);
        });
    </script>
</body>
</html>
