    <style>

            --bg-dark: #0f172a;

            --box-bg: #0f172a;
            --box-border: #475569;
            --text-gold: #fbbf24;
            --text-light: #f8fafc;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }

            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {

            display: flex;

        .header-bar {

            display: flex;

            padding: 16px 24px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--box-border);

        .title-area {

            border: 1.5px solid #c084fc !important;

        .job-hidden2 {

        .job-hidden2 .job-input { color: #f9a8d4 !important; text-shadow: 0 0 8px rgba(244, 114, 182, 0.6); }

            border: 1.5px solid #2dd4bf !important;

        }
        .job-hidden3 .job-input { color: #5eead4 !important; text-shadow: 0 0 8px rgba(45, 212, 191, 0.6); }

        .job-hidden4 {

            border: 1.5px solid #facc15 !important;

        }
        .job-hidden4 .job-input { color: #fde047 !important; text-shadow: 0 0 8px rgba(250, 204, 21, 0.6); }

        .job-hidden5 {

            border: 1.5px solid #22d3ee !important;

        .job-hidden5 .job-input { color: #67e8f9 !important; text-shadow: 0 0 8px rgba(34, 211, 238, 0.6); }

        .job-default { background-color: rgba(148, 163, 184, 0.15) !important; border-color: #64748b !important; }
        .job-default .job-input { color: #cbd5e1 !important; }

        .profile-wrap {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1e293b;
            border: 1px dashed var(--box-border);
            margin: 0 auto;
            display: flex;
            align-items: center;

        .btn-action-group {

            width: 100%;
            height: 100%;

        .btn-move {
            background: #334155;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 0 6px;

        .btn-del {
            background: var(--danger);
            color: white;
            border: none;

            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .custom-card {
            background-color: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .card-title-input {
            background: transparent;
            border: 1px solid var(--box-border);
            border-radius: 6px;
            color: var(--text-gold);
            font-size: 1.05rem;
            font-weight: bold;
            padding: 6px 10px;
            width: 100%;
            outline: none;
            text-align: center;
        }

        .card-title-view {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--text-gold);
            text-align: center;
            padding: 6px 0;

            border: 1px dashed var(--box-border);
            border-radius: 8px;

        }

        .card-memo-input {
            width: 100%;
            height: 90px;
            background: #111827;
            border: 1px solid var(--box-border);
            border-radius: 6px;
            color: var(--text-light);
            padding: 8px;
            font-size: 0.9rem;
            resize: vertical;
            outline: none;
        }

        .card-memo-view {
            width: 100%;
            min-height: 90px;
            background: #111827;
            border: 1px solid var(--box-border);
            border-radius: 6px;
            color: var(--text-light);
            padding: 8px;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .card-del-btn {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* 🔍 이미지 확대 보기 모달 스타일 */
        .img-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            cursor: zoom-out;
        }

        .img-modal-content {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* 비밀번호 모달 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--box-border);
            padding: 24px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-gold);
            margin-bottom: 16px;
        }

        .modal-input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--box-border);
            background: var(--box-bg);
            color: white;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 16px;
            outline: none;
        }

        .modal-btn-group { display: flex; gap: 8px; }
        .modal-btn { flex: 1; padding: 8px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .modal-btn-submit { background: var(--primary); color: white; }
        .modal-btn-cancel { background: #475569; color: white; }

</head>
<body>

    <div class="header-bar">
        <div class="title-area">
            🛡️ 킴성태팀 종합 현황판
            <span id="modeBadge" class="badge badge-view">🔒 읽기 전용</span>
        </div>
        <div class="btn-group">
            <button id="authBtn" class="btn btn-lock" onclick="toggleAuth()">🔓 수정 권한 얻기</button>
            <button id="addColBtn" class="btn btn-col" style="display:none;" onclick="addColumn()">+ 항목(열) 추가</button>
            <button id="addBtn" class="btn btn-add" style="display:none;" onclick="addRow()">+ 팀원 추가</button>
            <button id="saveBtn" class="btn" style="display:none;" onclick="saveData()">💾 저장하기</button>
            <button class="btn btn-pw" onclick="openPwChangeModal()">🔑 비번 변경</button>
        </div>
    </div>

    <!-- 탭 메뉴 -->
    <div class="tab-bar">
        <button id="tabSpec" class="tab-btn active" onclick="switchTab('spec')">⚔️ 1. 스펙 현황</button>
        <button id="tabItem" class="tab-btn" onclick="switchTab('item')">📦 2. 아이템 보유</button>
        <button id="tabMap" class="tab-btn" onclick="switchTab('map')">🗺️ 3. 클창맵 현황</button>
        <button id="tabHidden" class="tab-btn" onclick="switchTab('hidden')">🕵️‍♂️ 4. 히든 추리</button>
    </div>

    <div class="board-container">
        <!-- 표 형태 컨테이너 -->
        <div id="tableWrapper">
            <table id="mainTable">
                <thead>
                    <tr id="headerRow"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- 🗺️ 클창맵 갤러리 컨테이너 -->
        <div id="mapWrapper" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="color: var(--text-gold);">🗺️ 클창맵 공략 및 스크린샷 갤러리</h3>
                <button id="addMapCardBtn" class="btn btn-add" style="display:none;" onclick="addMapCard()">+ 새 클창맵 카드 추가</button>
            </div>
            <div id="mapGrid" class="card-grid"></div>
        </div>

        <!-- 🕵️‍♂️ 히든직업 추리 갤러리 컨테이너 -->
        <div id="hiddenWrapper" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="color: var(--text-gold);">🕵️‍♂️ 히든직업 5개 추리 및 단서 갤러리</h3>
            </div>
            <div id="hiddenGrid" class="card-grid"></div>
        </div>
    </div>

    <!-- 이미지 확대 보기 모달 -->
    <div id="imgModal" class="img-modal-overlay" onclick="closeImgModal()">
        <img id="modalZoomImg" class="img-modal-content" src="">
    </div>

    <!-- 비밀번호 입력 모달 -->
    <div id="pwModal" class="modal-overlay">
        <div class="modal-content">
            <div id="modalTitle" class="modal-title">🔑 비밀번호 입력</div>
            <input type="password" id="pwInput" class="modal-input" placeholder="비밀번호 입력" onkeyup="handleModalKey(event)">
            <input type="password" id="pwNewInput" class="modal-input" placeholder="새 비밀번호 입력" style="display:none;" onkeyup="handleModalKey(event)">
            <div class="modal-btn-group">
                <button class="modal-btn modal-btn-submit" onclick="submitPwModal()">확인</button>
                <button class="modal-btn modal-btn-cancel" onclick="closePwModal()">취소</button>
            </div>
        </div>
    </div>

        function switchTab(tab) {
            syncInputsToData();
            activeTab = tab;
            document.getElementById('tabSpec').className = 'tab-btn ' + (tab === 'spec' ? 'active' : '');
            document.getElementById('tabItem').className = 'tab-btn ' + (tab === 'item' ? 'active' : '');
            document.getElementById('tabMap').className = 'tab-btn ' + (tab === 'map' ? 'active' : '');
            document.getElementById('tabHidden').className = 'tab-btn ' + (tab === 'hidden' ? 'active' : '');

            const tableWrapper = document.getElementById('tableWrapper');
            const mapWrapper = document.getElementById('mapWrapper');
            const hiddenWrapper = document.getElementById('hiddenWrapper');
            const addColBtn = document.getElementById('addColBtn');
            const addBtn = document.getElementById('addBtn');

            tableWrapper.style.display = 'none';
            mapWrapper.style.display = 'none';
            hiddenWrapper.style.display = 'none';
            if(addColBtn) addColBtn.style.display = 'none';
            if(addBtn) addBtn.style.display = 'none';

            if (tab === 'map') {
                mapWrapper.style.display = 'block';
                renderMapCards();
            } else if (tab === 'hidden') {
                hiddenWrapper.style.display = 'block';
                renderHiddenCards();
            } else {
                tableWrapper.style.display = 'block';
                if(addColBtn) addColBtn.style.display = isEdit ? 'inline-block' : 'none';
                if(addBtn) addBtn.style.display = isEdit ? 'inline-block' : 'none';
                renderAll();
            }
        }

        function getPw() {
            return localStorage.getItem('board_pw') || DEFAULT_PW;
        }

        function openLoginModal() {
            modalMode = 'login';
            document.getElementById('modalTitle').innerText = "🔑 수정 권한 비밀번호";
            document.getElementById('pwInput').value = "";
            document.getElementById('pwInput').placeholder = "비밀번호 입력 (기본: 1234)";
            document.getElementById('pwNewInput').style.display = "none";
            document.getElementById('pwModal').style.display = "flex";
            document.getElementById('pwInput').focus();
        }

        function openPwChangeModal() {
            modalMode = 'change';
            document.getElementById('modalTitle').innerText = "🔑 비밀번호 변경";
            document.getElementById('pwInput').value = "";
            document.getElementById('pwInput').placeholder = "현재 비밀번호";
            document.getElementById('pwNewInput').value = "";
            document.getElementById('pwNewInput').style.display = "block";
            document.getElementById('pwModal').style.display = "flex";
            document.getElementById('pwInput').focus();
        }

        function closePwModal() {
            document.getElementById('pwModal').style.display = "none";
        }

        function handleModalKey(e) {
            if (e.key === 'Enter') submitPwModal();
            if (e.key === 'Escape') closePwModal();
        }

        function submitPwModal() {
            const inputPw = document.getElementById('pwInput').value;

            if (modalMode === 'login') {
                if (inputPw === getPw()) {
                    isEdit = true;
                    closePwModal();
                    updateUI();
                } else {
                    alert("비밀번호가 틀렸습니다.");
                }
            } else if (modalMode === 'change') {
                const newPw = document.getElementById('pwNewInput').value;
                if (inputPw === getPw()) {
                    if (newPw && newPw.trim()) {
                        localStorage.setItem('board_pw', newPw.trim());
                        alert("비밀번호가 성공적으로 변경되었습니다!");
                        closePwModal();
                    } else {
                        alert("새 비밀번호를 입력해주세요.");
                    }
                } else {
                    alert("현재 비밀번호가 틀렸습니다.");
                }
            }
        }

        function toggleAuth() {
            if (isEdit) {
                isEdit = false;
                updateUI();
            } else {
                openLoginModal();
            }
        }

        function updateUI() {
            const badge = document.getElementById('modeBadge');
            const authBtn = document.getElementById('authBtn');
            const addBtn = document.getElementById('addBtn');
            const addColBtn = document.getElementById('addColBtn');
            const addMapCardBtn = document.getElementById('addMapCardBtn');
            const saveBtn = document.getElementById('saveBtn');
            const table = document.getElementById('mainTable');

            if (isEdit) {
                badge.innerText = "✏️ 수정 모드";
                badge.className = "badge badge-edit";
                authBtn.innerText = "🔒 수정 잠그기";
                if(activeTab === 'spec' || activeTab === 'item') {
                    if(addBtn) addBtn.style.display = "inline-block";
                    if(addColBtn) addColBtn.style.display = "inline-block";
                }
                if(addMapCardBtn) addMapCardBtn.style.display = "inline-block";
                saveBtn.style.display = "inline-block";
                table.classList.add('editable');
            } else {
                badge.innerText = "🔒 읽기 전용";
                badge.className = "badge badge-view";
                authBtn.innerText = "🔓 수정 권한 얻기";
                if(addBtn) addBtn.style.display = "none";
                if(addColBtn) addColBtn.style.display = "none";
                if(addMapCardBtn) addMapCardBtn.style.display = "none";
                saveBtn.style.display = "none";
                table.classList.remove('editable');
            }

            if (activeTab === 'map') renderMapCards();
            else if (activeTab === 'hidden') renderHiddenCards();
            else renderAll();
        }

        function getJobClass(jobText) {
            if (!jobText) return 'job-default';
            const val = jobText.trim();
            if (val.includes('나이트')) return 'job-knight';
            if (val.includes('위자드')) return 'job-wizard';
            if (val.includes('워리어')) return 'job-warrior';
            if (val.includes('어쌔신')) return 'job-assassin';
            if (val.includes('헌터')) return 'job-hunter';
            
            if (val.includes('히든직업 1') || val.includes('히든 1')) return 'job-hidden1';
            if (val.includes('히든직업 2') || val.includes('히든 2')) return 'job-hidden2';
            if (val.includes('히든직업 3') || val.includes('히든 3')) return 'job-hidden3';
            if (val.includes('히든직업 4') || val.includes('히든 4')) return 'job-hidden4';
            if (val.includes('히든직업 5') || val.includes('히든 5')) return 'job-hidden5';
            
            return 'job-default';
        }

        function handleJobInput(inputElem) {
            const tdBox = inputElem.closest('.td-box');
            if (tdBox) {
                tdBox.className = 'td-box job-tag ' + getJobClass(inputElem.value);
            }
        }

        function syncInputsToData() {
            if (activeTab === 'map') {
                const cards = document.querySelectorAll('#mapGrid .custom-card');
                cards.forEach((card, idx) => {
                    if (!mapCards[idx]) return;
                    const titleInp = card.querySelector('.card-title-input');
                    const memoInp = card.querySelector('.card-memo-input');
                    if (titleInp) mapCards[idx].title = titleInp.value;
                    if (memoInp) mapCards[idx].memo = memoInp.value;
                });
                return;
            }

            if (activeTab === 'hidden') {
                const cards = document.querySelectorAll('#hiddenGrid .custom-card');
                cards.forEach((card, idx) => {
                    if (!hiddenCards[idx]) return;
                    const titleInp = card.querySelector('.card-title-input');
                    const memoInp = card.querySelector('.card-memo-input');
                    if (titleInp) hiddenCards[idx].title = titleInp.value;
                    if (memoInp) hiddenCards[idx].memo = memoInp.value;
                });
                return;
            }

            const cols = getCurrentColumns();
            document.querySelectorAll('#headerRow input').forEach(inp => {
                const colId = inp.dataset.colid;
                const colObj = cols.find(c => c.id === colId);
                if (colObj) colObj.title = inp.value;
            });

            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach((r, idx) => {
                if (!membersData[idx]) return;
                r.querySelectorAll('input[type="text"]').forEach(inp => {
                    const colId = inp.dataset.colid;
                    if (colId) membersData[idx][colId] = inp.value;
                });
            });
        }

        function addColumn() {
            if (!isEdit) return;
            syncInputsToData();
            const title = prompt("새로 추가할 항목(열)의 이름을 입력하세요:", "새 항목");
            if (!title) return;

            const cols = getCurrentColumns();
            let prefix = 'c_';
            if (activeTab === 'item') prefix = 'i_';

            const newId = prefix + Date.now();
            cols.push({ id: newId, title: title.trim(), width: "100px" });

            membersData.forEach(m => {
                if (m[newId] === undefined) m[newId] = "";
            });

            renderAll();
        }

        function delColumn(colId) {
            if (!isEdit) return;
            if (confirm("이 항목(열) 전체를 삭제하시겠습니까?")) {
                syncInputsToData();
                if (activeTab === 'spec') specColumns = specColumns.filter(c => c.id !== colId);
                else if (activeTab === 'item') itemColumns = itemColumns.filter(c => c.id !== colId);
                renderAll();
            }
        }

        function moveColumn(colIdx, dir) {
            if (!isEdit) return;
            syncInputsToData();

            const cols = getCurrentColumns();
            const targetIdx = colIdx + dir;
            if (targetIdx < 0 || targetIdx >= cols.length) return;

            const temp = cols[colIdx];
            cols[colIdx] = cols[targetIdx];
            cols[targetIdx] = temp;

            renderAll();
        }

        function moveRow(idx, dir) {
            if (!isEdit) return;
            syncInputsToData();

            const targetIdx = idx + dir;
            if (targetIdx < 0 || targetIdx >= membersData.length) return;

            const temp = membersData[idx];
            membersData[idx] = membersData[targetIdx];
            membersData[targetIdx] = temp;

            renderBody();
        }

        function renderAll() {
            renderHeader();
            renderBody();
        }

        function renderHeader() {
            const tr = document.getElementById('headerRow');
            tr.innerHTML = `<th style="width: 55px;"><div class="th-box">프로필</div></th>`;

            const cols = getCurrentColumns();
            cols.forEach((col, idx) => {
                const th = document.createElement('th');
                th.style.width = col.width || "90px";
                th.innerHTML = `
                    <div class="th-box">
                        <input type="text" data-colid="${col.id}" value="${col.title}" ${!isEdit ? 'readonly' : ''}>
                        <div class="col-btn-group">
                            <button class="btn-col-mv" onclick="moveColumn(${idx}, -1)">◀</button>
                            <button class="btn-col-mv" onclick="moveColumn(${idx}, 1)">▶</button>
                            <button class="btn-col-del" onclick="delColumn('${col.id}')">✕</button>
                        </div>
                    </div>
                `;
                tr.appendChild(th);
            });

            if (isEdit) {
                tr.innerHTML += `<th style="width: 100px;"><div class="th-box" style="color:var(--text-gold);">관리</div></th>`;
            }
        }

        function renderBody() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const cols = getCurrentColumns();

            membersData.forEach((m, idx) => {
                const tr = document.createElement('tr');
                let html = `
                    <td>
                        <div class="td-box">
                            <div class="profile-wrap" onclick="${isEdit ? `triggerFile(${idx})` : (m.img ? `openImgModal('${m.img}')` : '')}">
                                ${m.img ? `<img src="${m.img}">` : `<span>사진</span>`}
                            </div>
                            <input type="file" id="f-${idx}" class="file-input" accept="image/*" onchange="uploadImg(event, ${idx})">
                        </div>
                    </td>
                `;

                cols.forEach(col => {
                    const val = m[col.id] || "";
                    const isName = (col.id === 'c1');
                    const isJob = (col.id === 'c2' && activeTab === 'spec');
                    
                    if (isJob) {
                        html += `
                            <td>
                                <div class="td-box job-tag ${getJobClass(val)}">
                                    <input type="text" class="job-input" data-colid="${col.id}" value="${val}" ${!isEdit ? 'readonly' : ''} oninput="handleJobInput(this)">
                                </div>
                            </td>
                        `;
                    } else {
                        html += `
                            <td>
                                <div class="td-box">
                                    <input type="text" data-colid="${col.id}" value="${val}" ${!isEdit ? 'readonly' : ''} style="${isName ? 'font-weight:bold;' : ''}">
                                </div>
                            </td>
                        `;
                    }
                });

                if (isEdit) {
                    html += `
                        <td>
                            <div class="td-box" style="padding:2px; border:none; background:transparent;">
                                <div class="btn-action-group">
                                    <button class="btn-move" onclick="moveRow(${idx}, -1)">▲</button>
                                    <button class="btn-move" onclick="moveRow(${idx}, 1)">▼</button>
                                    <button class="btn-del" onclick="delRow(this)">삭제</button>
                                </div>
                            </div>
                        </td>
                    `;
                }

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        // 🗺️ 클창맵 카드 렌더링
        function renderMapCards() {
            const grid = document.getElementById('mapGrid');
            grid.innerHTML = '';

            mapCards.forEach((card, idx) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'custom-card';

                let titleHtml = isEdit 
                    ? `<input type="text" class="card-title-input" value="${card.title || ''}" placeholder="구역 이름 입력">`
                    : `<div class="card-title-view">${card.title || '구역 이름 없음'}</div>`;

                let memoHtml = isEdit
                    ? `<textarea class="card-memo-input" placeholder="공략 및 메모 입력">${card.memo || ''}</textarea>`
                    : `<div class="card-memo-view">${card.memo || '등록된 메모가 없습니다.'}</div>`;

                cardDiv.innerHTML = `
                    ${titleHtml}
                    <div class="card-img-box" onclick="${card.img && !isEdit ? `openImgModal('${card.img}')` : `triggerMapFile(${idx})`}">
                        ${card.img ? `<img src="${card.img}">` : `<div class="card-img-placeholder">${isEdit ? '📷 클릭하여 지도/스크린샷 업로드' : '등록된 이미지가 없습니다.'}</div>`}
                        <input type="file" id="map-f-${idx}" class="file-input" accept="image/*" onchange="uploadMapImg(event, ${idx})">
                    </div>
                    ${card.img && isEdit ? `<button class="btn" style="background:#475569; padding:4px; font-size:0.75rem;" onclick="openImgModal('${card.img}')">🔍 이미지 크게 보기</button>` : ''}
                    ${memoHtml}
                    ${isEdit ? `<button class="card-del-btn" onclick="delMapCard(${idx})">카드 삭제</button>` : ''}

                grid.appendChild(cardDiv);

        // 🕵️‍♂️ 히든직업 카드 렌더링 (5개 고정)

            const grid = document.getElementById('hiddenGrid');

                `;
                grid.appendChild(cardDiv);

        function triggerFile(idx) {
            if (isEdit) document.getElementById(`f-${idx}`).click();
        }

        function uploadImg(e, idx) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.src = evt.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 100;
                        canvas.height = 100;
                        ctx.drawImage(img, 0, 0, 100, 100);
                        membersData[idx].img = canvas.toDataURL('image/jpeg', 0.7);
                        renderBody();
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function triggerMapFile(idx) {
            if (isEdit) document.getElementById(`map-f-${idx}`).click();
        }

        function uploadMapImg(e, idx) {
            syncInputsToData();
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.src = evt.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;
                        if (width > 1200) {
                            height = Math.round((height * 1200) / width);
                            width = 1200;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        mapCards[idx].img = canvas.toDataURL('image/jpeg', 0.85);
                        renderMapCards();
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function triggerHiddenFile(idx) {
            if (isEdit) document.getElementById(`hidden-f-${idx}`).click();
        }

        function uploadHiddenImg(e, idx) {
            syncInputsToData();
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.src = evt.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;
                        if (width > 1200) {
                            height = Math.round((height * 1200) / width);
                            width = 1200;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        hiddenCards[idx].img = canvas.toDataURL('image/jpeg', 0.85);
                        renderHiddenCards();
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        // 이미지 확대 모달 제어
        function openImgModal(imgSrc) {
            if (!imgSrc) return;
            document.getElementById('modalZoomImg').src = imgSrc;
            document.getElementById('imgModal').style.display = 'flex';
        }

        function closeImgModal() {
            document.getElementById('imgModal').style.display = 'none';
        }

        function addMapCard() {
            if (!isEdit) return;
            syncInputsToData();
            mapCards.push({
                id: "m_" + Date.now(),
                title: "새 구역 공략",
                img: "",
                memo: "공략 내용을 입력하세요."
            });
            renderMapCards();
        }

        function delMapCard(idx) {
            if (!isEdit) return;
            if (confirm("이 클창맵 카드를 삭제하시겠습니까?")) {
                syncInputsToData();
                mapCards.splice(idx, 1);
                renderMapCards();
            }
        }

        function addRow() {
            if (!isEdit) return;
            syncInputsToData();
            const newMember = { img: "", c1: "새 팀원", c2: "나이트" };
            specColumns.forEach(c => { if(!newMember[c.id]) newMember[c.id] = "0"; });
            itemColumns.forEach(c => { if(!newMember[c.id]) newMember[c.id] = "0"; });
            membersData.push(newMember);
            renderBody();
        }

        function delRow(btn) {
            if (confirm("삭제하시겠습니까?")) {
                syncInputsToData();
                const tr = btn.closest('tr');
                const idx = Array.from(tr.parentNode.children).indexOf(tr);
                membersData.splice(idx, 1);
                renderBody();
            }
        }

        function saveData() {
            if (!isEdit) return;
            syncInputsToData();

            if (window.dbSet && window.dbRef) {
                window.dbSet(window.dbRef(window.db, 'dashboard_v6'), {
                    specColumns: specColumns,
                    itemColumns: itemColumns,
                    mapCards: mapCards,
                    hiddenCards: hiddenCards,
                    members: membersData
                }).then(() => {
                    alert("모든 탭과 카드 내용이 성공적으로 저장되었습니다!");
                }).catch((err) => {
                    alert("저장 실패: " + err.message);
                });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateUI();

            const timer = setInterval(() => {
                if (window.dbOnValue && window.dbRef && window.db) {
                    clearInterval(timer);
                    window.dbOnValue(window.dbRef(window.db, 'dashboard_v6'), (snapshot) => {
                        const val = snapshot.val();
                        if (val) {
                            if (val.specColumns) specColumns = val.specColumns;
                            if (val.itemColumns) itemColumns = val.itemColumns;
                            if (val.mapCards) mapCards = val.mapCards;
                            if (val.hiddenCards) hiddenCards = val.hiddenCards;
                            if (val.members) membersData = val.members;
                            
                            if (activeTab === 'map') renderMapCards();
                            else if (activeTab === 'hidden') renderHiddenCards();
                            else renderAll();
                        }
                    });
                }
            }, 100);
        });
    </script>
</body>
</html>
