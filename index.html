<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>킴성태팀 장비 강화 현황판</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #ff9800;
      --text-color: #ffffff;
      --border-color: #333333;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto 20px auto;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background-color: var(--accent-color);
      color: #000;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      position: relative;
    }

    .card.editing {
      border: 2px dashed var(--accent-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1em;
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--accent-color);
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .item-name { color: #bbb; }
    .item-value { font-weight: bold; }

    /* 수정 모드 컨트롤 */
    .edit-controls {
      display: none;
      margin-top: 10px;
      gap: 5px;
    }

    .editing .edit-controls {
      display: flex;
    }

    .editable-text {
      outline: none;
      border-radius: 3px;
      padding: 2px 4px;
    }

    .editing .editable-text {
      background-color: #2a2a2a;
    }

    .status-badge {
      text-align: center;
      margin-top: 10px;
      font-size: 0.85em;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚔️ 킴성태팀 장비 강화 현황판</h1>
    <div class="btn-group">
      <button id="editBtn" onclick="toggleEditMode()">✍️ 수정 모드</button>
      <button id="saveBtn" onclick="saveData()" style="display:none; background-color: #4caf50; color: white;">💾 저장하기</button>
    </div>
  </div>

  <div class="grid-container" id="gridContainer"></div>
  <div class="status-badge" id="statusBadge"></div>

  <script>
    // ==========================================
    // 🔒 비밀번호 설정 (오직 나만 코드에서 변경 가능)
    // ==========================================
    const MASTER_PASSWORD = "1234"; // ← 원하는 마스터 비밀번호로 변경하세요!

    // 기본 데이터 구조
    const defaultData = [
      { id: 1, name: "킴성태", weapon: "+12 전설 검", armor: "+10 대장군 갑옷", ring: "+8 반지" },
      { id: 2, name: "팀원 1", weapon: "+10 영웅 검", armor: "+8 사슬 갑옷", ring: "+5 반지" },
      { id: 3, name: "팀원 2", weapon: "+9 희귀 검", armor: "+7 가죽 갑옷", ring: "+4 반지" }
    ];

    let currentData = [];
    let isEditMode = false;

    // 페이지 로드 시 데이터 불러오기
    window.onload = () => {
      const saved = localStorage.getItem('kimteam_gear_data');
      currentData = saved ? JSON.parse(saved) : defaultData;
      render();
    };

    // 화면 렌더링
    function render() {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '';

      currentData.forEach((member, index) => {
        const card = document.createElement('div');
        card.className = `card ${isEditMode ? 'editing' : ''}`;
        
        card.innerHTML = `
          <div class="card-header">
            <span class="editable-text" contenteditable="${isEditMode}" data-key="name" data-index="${index}">${member.name}</span>
          </div>
          <div class="item-row">
            <span class="item-name">무기</span>
            <span class="editable-text item-value" contenteditable="${isEditMode}" data-key="weapon" data-index="${index}">${member.weapon}</span>
          </div>
          <div class="item-row">
            <span class="item-name">방어구</span>
            <span class="editable-text item-value" contenteditable="${isEditMode}" data-key="armor" data-index="${index}">${member.armor}</span>
          </div>
          <div class="item-row">
            <span class="item-name">장신구</span>
            <span class="editable-text item-value" contenteditable="${isEditMode}" data-key="ring" data-index="${index}">${member.ring}</span>
          </div>
          <div class="edit-controls">
            <button onclick="moveCard(${index}, -1)">◀ 왼쪽</button>
            <button onclick="moveCard(${index}, 1)">오른쪽 ▶</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 수정 모드 토글 (비밀번호 검증)
    function toggleEditMode() {
      if (!isEditMode) {
        const inputPw = prompt("매니저 비밀번호를 입력하세요:");
        if (inputPw !== MASTER_PASSWORD) {
          alert("비밀번호가 올바르지 않습니다.");
          return;
        }
        isEditMode = true;
        document.getElementById('editBtn').innerText = "❌ 수정 취소";
        document.getElementById('saveBtn').style.display = "inline-block";
      } else {
        isEditMode = false;
        document.getElementById('editBtn').innerText = "✍️ 수정 모드";
        document.getElementById('saveBtn').style.display = "none";
      }
      render();
    }

    // 카드 위치 변경 (위치/순서 바꾸기)
    function moveCard(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= currentData.length) return;
      
      const temp = currentData[index];
      currentData[index] = currentData[targetIndex];
      currentData[targetIndex] = temp;
      render();
    }

    // 데이터 저장
    function saveData() {
      // 화면의 수정된 텍스트 수집
      const editableElements = document.querySelectorAll('.editable-text');
      editableElements.forEach(el => {
        const index = el.getAttribute('data-index');
        const key = el.getAttribute('data-key');
        currentData[index][key] = el.innerText.trim();
      });

      // 브라우저 저장소에 보관
      localStorage.setItem('kimteam_gear_data', JSON.stringify(currentData));
      
      isEditMode = false;
      document.getElementById('editBtn').innerText = "✍️ 수정 모드";
      document.getElementById('saveBtn').style.display = "none";
      render();

      alert("수정 내용이 저장되었습니다!");
    }
  </script>
</body>
</html>
