    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --box-bg: #0f172a;
            --box-border: #475569;
            --text-gold: #fbbf24;
            --text-light: #f8fafc;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {

            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {

            color: var(--text-light);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bar {
            width: 100%;
            max-width: 1600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
            padding: 16px 24px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--box-border);
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: bold;
        }

        .badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: normal;
        }

        .badge-view { background: #334155; color: #94a3b8; }
        .badge-edit { background: #065f46; color: #34d399; }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-lock { background-color: #475569; }
        .btn-add { background-color: var(--success); }
        .btn-col { background-color: #8b5cf6; }
        .btn-pw { background-color: #6366f1; }
        .btn-tab { background-color: #0ea5e9; }

        .tab-bar {
            width: 100%;
            max-width: 1600px;
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tab-btn-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .tab-btn {
            background-color: #334155;
            color: #94a3b8;
            border: 1px solid var(--box-border);
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--panel-bg);
            color: var(--text-gold);
            border-bottom: 2px solid var(--text-gold);
        }

        .tab-del-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.65rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .editable-tabs .tab-del-btn { display: flex; }

        .board-container {
            width: 100%;
            max-width: 1600px;
            background-color: var(--panel-bg);
            border: 1px solid var(--box-border);
            border-radius: 0 8px 8px 8px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 6px 10px;
            text-align: center;
        }

        th {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-gold);
            padding: 0;
            min-width: 90px;
        }

        th .th-box {
            background-color: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 6px;
            height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
            position: relative;
        }

        th input {
            color: var(--text-gold);
            font-weight: bold;
            text-align: center;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.88rem;
        }

        .col-btn-group {
            display: none;

            margin-top: 2px;
        }

            border: none;
            color: var(--text-light);
            text-align: center;
            font-size: 0.92rem;
            outline: none;

            height: 100%;

            border: none;
            outline: none;
            text-align: center;
            text-align-last: center;
            font-weight: bold;
            font-size: 0.92rem;
            cursor: pointer;

        .job-select option {
            background-color: #1e293b;
            color: #f8fafc;

        .job-tag { border-radius: 4px; font-weight: bold; }
        .job-knight { background-color: rgba(59, 130, 246, 0.25) !important; border-color: #3b82f6 !important; }
        .job-knight .job-select { color: #60a5fa !important; }
        .job-wizard { background-color: rgba(168, 85, 247, 0.25) !important; border-color: #a855f7 !important; }
        .job-wizard .job-select { color: #c084fc !important; }
        .job-warrior { background-color: rgba(239, 68, 68, 0.25) !important; border-color: #ef4444 !important; }
        .job-warrior .job-select { color: #f87171 !important; }
        .job-assassin { background-color: rgba(249, 115, 22, 0.25) !important; border-color: #f97316 !important; }
        .job-assassin .job-select { color: #fb923c !important; }
        .job-hunter { background-color: rgba(16, 185, 129, 0.25) !important; border-color: #10b981 !important; }
        .job-hunter .job-select { color: #34d399 !important; }
        .job-default { background-color: rgba(148, 163, 184, 0.15) !important; border-color: #64748b !important; }

        .profile-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px dashed var(--box-border);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;

        .profile-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .profile-wrap span { font-size: 0.75rem; color: #94a3b8; font-weight: bold; }
        .file-input { display: none; }

        .btn-action-group { display: flex; gap: 2px; width: 100%; height: 100%; align-items: center; justify-content: center; }
        .btn-move { background: #334155; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.75rem; padding: 4px 8px; }
        .btn-del { background: var(--danger); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; padding: 4px 8px; }

        /* 맵 탭 및 공용 이미지 보드 스타일 */
        .section-box {
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .img-upload-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        .img-card {
            background: var(--panel-bg);
            border: 1px solid var(--box-border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .img-card-preview {
            width: 100%;
            height: 200px;
            background: #0f172a;
            border: 1px dashed var(--box-border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .img-card-preview img { width: 100%; height: 100%; object-fit: contain; }
        .img-card-preview span { color: #94a3b8; font-size: 0.9rem; font-weight: bold; }
        .img-card input[type="text"] {
            width: 100%;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            color: var(--text-light);
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }
        .img-card textarea {
            width: 100%;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            color: var(--text-light);
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            resize: vertical;
            height: 70px;
            outline: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--box-border);
            padding: 24px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-title { font-size: 1.1rem; font-weight: bold; color: var(--text-gold); margin-bottom: 16px; }
        .modal-input {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--box-border);
            background: var(--box-bg); color: white; text-align: center; font-size: 1.1rem; margin-bottom: 16px; outline: none;
        }
        .modal-btn-group { display: flex; gap: 8px; }
        .modal-btn { flex: 1; padding: 8px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .modal-btn-submit { background: var(--primary); color: white; }
        .modal-btn-cancel { background: #475569; color: white; }
    </style>
</head>
<body>

            document.getElementById('pwInput').style.display = "block";
            document.getElementById('pwInput').value = "";
            document.getElementById('pwInput').placeholder = "비밀번호 입력";
            document.getElementById('pwNewInput').style.display = "none";
            document.getElementById('customTabInput').style.display = "none";
            document.getElementById('pwModal').style.display = "flex";
            document.getElementById('pwInput').focus();
        }

        function openPwChangeModal() {
            modalMode = 'change';
            document.getElementById('modalTitle').innerText = "🔑 마스터 비밀번호 변경";
            document.getElementById('pwInput').style.display = "block";
            document.getElementById('pwInput').value = "";
            document.getElementById('pwInput').placeholder = "현재 비밀번호";
            document.getElementById('pwNewInput').style.display = "block";
            document.getElementById('pwNewInput').value = "";
            document.getElementById('customTabInput').style.display = "none";
            document.getElementById('pwModal').style.display = "flex";
            document.getElementById('pwInput').focus();
        }

        function openAddTabModal() {
            modalMode = 'addTab';
            document.getElementById('modalTitle').innerText = "➕ 새 탭 추가";
            document.getElementById('pwInput').style.display = "none";
            document.getElementById('pwNewInput').style.display = "none";
            document.getElementById('customTabInput').style.display = "block";
            document.getElementById('customTabInput').value = "";
            document.getElementById('pwModal').style.display = "flex";
            document.getElementById('customTabInput').focus();
        }

        function closeModal() {
            document.getElementById('pwModal').style.display = "none";
        }

        function handleModalKey(e) {
            if (e.key === 'Enter') submitModal();
            if (e.key === 'Escape') closeModal();
        }

        function submitModal() {
            if (modalMode === 'login') {
                const inputPw = document.getElementById('pwInput').value;
                if (inputPw === getPw()) {
                    isEdit = true;
                    closeModal();
                    updateUI();
                } else {
                    alert("비밀번호가 틀렸습니다.");
                }
            } else if (modalMode === 'change') {
                const inputPw = document.getElementById('pwInput').value;
                const newPw = document.getElementById('pwNewInput').value;
                if (inputPw === getPw()) {
                    if (newPw && newPw.trim()) {
                        localStorage.setItem('board_pw', newPw.trim());
                        alert("비밀번호가 성공적으로 변경되었습니다!");
                        closeModal();
                    } else {
                        alert("새 비밀번호를 입력해주세요.");
                    }
                } else {
                    alert("현재 비밀번호가 틀렸습니다.");
                }
            } else if (modalMode === 'addTab') {
                const tabName = document.getElementById('customTabInput').value;
                if (tabName && tabName.trim()) {
                    const newId = 'custom_' + Date.now();
                    customTabs.push({ id: newId, name: tabName.trim(), content: "새로 만든 탭의 내용을 입력하세요." });
                    activeTab = newId;
                    closeModal();
                    renderAll();
                } else {
                    alert("탭 이름을 입력해주세요.");
                }
            }
        }

        function toggleAuth() {
            if (isEdit) {
                isEdit = false;
                updateUI();
            } else {
                openLoginModal();
            }
        }

        function updateUI() {
            const badge = document.getElementById('modeBadge');
            const authBtn = document.getElementById('authBtn');
            const addBtn = document.getElementById('addBtn');
            const addColBtn = document.getElementById('addColBtn');
            const addTabBtn = document.getElementById('addTabBtn');
            const saveBtn = document.getElementById('saveBtn');
            const pwChangeBtn = document.getElementById('pwChangeBtn');

            if (isEdit) {
                badge.innerText = "✏️ 수정 모드";
                badge.className = "badge badge-edit";
                authBtn.innerText = "🔒 수정 잠그기";
                saveBtn.style.display = "inline-block";
                pwChangeBtn.style.display = "inline-block";
                addTabBtn.style.display = "inline-block";
                if (activeTab === 'spec' || activeTab === 'item') {
                    addBtn.style.display = "inline-block";
                    addColBtn.style.display = "inline-block";
                } else {
                    addBtn.style.display = "none";
                    addColBtn.style.display = "none";
                }
            } else {
                badge.innerText = "🔒 읽기 전용";
                badge.className = "badge badge-view";
                authBtn.innerText = "🔓 수정 권한 얻기";
                addBtn.style.display = "none";
                addColBtn.style.display = "none";
                addTabBtn.style.display = "none";
                saveBtn.style.display = "none";
                pwChangeBtn.style.display = "none";
            }

            renderTabBar();
            renderAll();
        }

        function syncInputsToData() {
            if (activeTab === 'spec' || activeTab === 'item') {
                const cols = getCurrentColumns();
                const headerInputs = document.querySelectorAll('#headerRow input');
                headerInputs.forEach(inp => {
                    const colId = inp.dataset.colid;
                    const colObj = cols.find(c => c.id === colId);
                    if (colObj) colObj.title = inp.value;
                });

                const rows = document.querySelectorAll('#tableBody tr');
                rows.forEach((r, idx) => {
                    if (!membersData[idx]) return;
                    r.querySelectorAll('input[type="text"], select').forEach(inp => {
                        const colId = inp.dataset.colid;
                        if (colId) membersData[idx][colId] = inp.value;
                    });
                });
            } else if (activeTab === 'map') {
                mapImages.forEach((item, idx) => {
                    const titleElem = document.getElementById(`map_title_${idx}`);
                    const memoElem = document.getElementById(`map_memo_${idx}`);
                    if (titleElem) item.title = titleElem.value;
                    if (memoElem) item.memo = memoElem.value;
                });
            } else if (activeTab === 'hidden') {
                hiddenJobsData.forEach((job, idx) => {
                    const nameElem = document.getElementById(`hidden_name_${idx}`);
                    const memoElem = document.getElementById(`hidden_memo_${idx}`);
                    if (nameElem) job.name = nameElem.value;
                    if (memoElem) job.memo = memoElem.value;
                });
            } else {
                const txtArea = document.getElementById('customTextArea');
                if (txtArea) {
                    const found = customTabs.find(t => t.id === activeTab);
                    if (found) found.content = txtArea.value;
                }
            }
        }

        function renderTabBar() {
            const tabBar = document.getElementById('tabBar');
            let html = `
                <div class="tab-btn-wrap"><button id="tabSpec" class="tab-btn ${activeTab === 'spec' ? 'active' : ''}" onclick="switchTab('spec')">⚔️ 스펙 현황</button></div>
                <div class="tab-btn-wrap"><button id="tabItem" class="tab-btn ${activeTab === 'item' ? 'active' : ''}" onclick="switchTab('item')">📦 아이템 현황</button></div>
                <div class="tab-btn-wrap"><button id="tabMap" class="tab-btn ${activeTab === 'map' ? 'active' : ''}" onclick="switchTab('map')">🗺️ 맵 탭</button></div>
                <div class="tab-btn-wrap"><button id="tabHidden" class="tab-btn ${activeTab === 'hidden' ? 'active' : ''}" onclick="switchTab('hidden')">🕵️ 히든추리 탭</button></div>
            `;

            customTabs.forEach(t => {
                html += `
                    <div class="tab-btn-wrap ${isEdit ? 'editable-tabs' : ''}">
                        <button class="tab-btn ${activeTab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')">${t.name}</button>
                        <button class="tab-del-btn" onclick="deleteCustomTab('${t.id}')" title="탭 삭제">✕</button>
                    </div>
                `;
            });

            tabBar.innerHTML = html;
        }

        function deleteCustomTab(tabId) {
            if (!isEdit) return;
            if (confirm("이 탭을 삭제하시겠습니까?")) {
                customTabs = customTabs.filter(t => t.id !== tabId);
                if (activeTab === tabId) activeTab = 'spec';
                renderTabBar();
                renderAll();
            }
        }

        function renderAll() {
            renderTabBar();
            const container = document.getElementById('boardContainer');
            const addBtn = document.getElementById('addBtn');
            const addColBtn = document.getElementById('addColBtn');

            if (activeTab === 'spec' || activeTab === 'item') {
                if (isEdit) {
                    addBtn.style.display = "inline-block";
                    addColBtn.style.display = "inline-block";
                    container.classList.add('editable');
                } else {
                    addBtn.style.display = "none";
                    addColBtn.style.display = "none";
                    container.classList.remove('editable');
                }

                container.innerHTML = `
                    <table id="mainTable">
                        <thead><tr id="headerRow"></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                `;
                renderHeader();
                renderBody();
            } else if (activeTab === 'map') {
                addBtn.style.display = "none";
                addColBtn.style.display = "none";
                container.classList.remove('editable');
                renderMapTab(container);
            } else if (activeTab === 'hidden') {
                addBtn.style.display = "none";
                addColBtn.style.display = "none";
                container.classList.remove('editable');
                renderHiddenTab(container);
            } else {
                addBtn.style.display = "none";
                addColBtn.style.display = "none";
                container.classList.remove('editable');
                renderCustomTab(container);
            }
        }

        function renderMapTab(container) {
            let cardsHtml = '';
            mapImages.forEach((item, idx) => {
                cardsHtml += `
                    <div class="img-card">
                        <input type="text" id="map_title_${idx}" value="${item.title}" ${!isEdit ? 'readonly' : ''} placeholder="맵/지역 이름">
                        <div class="img-card-preview" onclick="${isEdit ? `triggerMapFile(${idx})` : ''}">
                            ${item.img ? `<img src="${item.img}">` : `<span>${isEdit ? '+ 스크린샷/사진 업로드' : '사진 없음'}</span>`}
                        </div>
                        <input type="file" id="map_file_${idx}" class="file-input" accept="image/*" onchange="uploadMapImg(event, ${idx})">
                        <textarea id="map_memo_${idx}" ${!isEdit ? 'readonly' : ''} placeholder="사냥터 정보, 주요 드랍 및 메모">${item.memo}</textarea>
                        ${isEdit ? `<button class="btn btn-del" style="padding:4px; font-size:0.8rem;" onclick="delMapCard(${idx})">카드 삭제</button>` : ''}
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="section-box">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <h3 style="color:var(--text-gold);">🗺️ 맵 및 사냥터 정보 관리</h3>
                        ${isEdit ? `<button class="btn btn-add" style="padding:6px 12px; font-size:0.85rem;" onclick="addMapCard()">+ 맵 카드 추가</button>` : ''}
                    </div>
                    <div class="img-upload-grid">${cardsHtml}</div>
                </div>
            `;
        }

        function renderHiddenTab(container) {
            let cardsHtml = '';
            hiddenJobsData.forEach((job, idx) => {
                cardsHtml += `
                    <div class="img-card">
                        <input type="text" id="hidden_name_${idx}" value="${job.name}" ${!isEdit ? 'readonly' : ''} placeholder="히든직업 이름">
                        <div class="img-card-preview" onclick="${isEdit ? `triggerHiddenFile(${idx})` : ''}">
                            ${job.img ? `<img src="${job.img}">` : `<span>${isEdit ? '+ 단서 사진 업로드' : '사진 없음'}</span>`}
                        </div>
                        <input type="file" id="hidden_file_${idx}" class="file-input" accept="image/*" onchange="uploadHiddenImg(event, ${idx})">
                        <textarea id="hidden_memo_${idx}" ${!isEdit ? 'readonly' : ''} placeholder="전직 조건, 추리 내용, 단서 기록">${job.memo}</textarea>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="section-box">
                    <h3 style="color:var(--text-gold); margin-bottom: 12px;">🕵️ 5대 히든직업 추리 및 단서 노트</h3>
                    <p style="color:#94a3b8; font-size:0.9rem; margin-bottom:12px;">각 히든직업별로 전직 단서나 스크린샷 사진을 큼지막하게 등록하여 팀원들과 공유하세요.</p>
                    <div class="img-upload-grid">${cardsHtml}</div>
                </div>
            `;
        }

        function renderCustomTab(container) {
            const found = customTabs.find(t => t.id === activeTab);
            const contentVal = found ? found.content : "";
            container.innerHTML = `
                <div class="section-box">
                    <h3 style="color:var(--text-gold); margin-bottom: 12px;">📌 ${found ? found.name : '사용자 탭'}</h3>
                    <textarea id="customTextArea" style="width:100%; height:450px; background:var(--box-bg); color:var(--text-light); border:1px solid var(--box-border); border-radius:6px; padding:15px; font-size:1rem; resize:vertical; outline:none;" ${!isEdit ? 'readonly' : ''}>${contentVal}</textarea>
                </div>
            `;
        }

        function triggerMapFile(idx) { document.getElementById(`map_file_${idx}`).click(); }
        function uploadMapImg(e, idx) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                mapImages[idx].img = evt.target.result;
                renderAll();
            };
            reader.readAsDataURL(file);
        }
        function addMapCard() {
            syncInputsToData();
            mapImages.push({ id: "m_" + Date.now(), title: "새로운 맵/지역", img: "", memo: "" });
            renderAll();
        }
        function delMapCard(idx) {
            syncInputsToData();
            mapImages.splice(idx, 1);
            renderAll();
        }

        function triggerHiddenFile(idx) { document.getElementById(`hidden_file_${idx}`).click(); }
        function uploadHiddenImg(e, idx) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                hiddenJobsData[idx].img = evt.target.result;
                renderAll();
            };
            reader.readAsDataURL(file);
        }

        function renderHeader() {
            const tr = document.getElementById('headerRow');
            if (!tr) return;
            tr.innerHTML = `<th style="width: 75px;"><div class="th-box">프로필</div></th>`;

            const cols = getCurrentColumns();
            cols.forEach((col, idx) => {
                const th = document.createElement('th');
                th.style.width = col.width || "90px";
                th.innerHTML = `
                    <div class="th-box">
                        <input type="text" data-colid="${col.id}" value="${col.title}" ${!isEdit ? 'readonly' : ''}>
                        <div class="col-btn-group">
                            <button class="btn-col-mv" onclick="moveColumn(${idx}, -1)">◀</button>
                            <button class="btn-col-mv" onclick="moveColumn(${idx}, 1)">▶</button>
                            <button class="btn-col-del" onclick="delColumn('${col.id}')">✕</button>
                        </div>
                    </div>
                `;
                tr.appendChild(th);
            });

            if (isEdit) {
                tr.innerHTML += `<th style="width: 100px;"><div class="th-box" style="color:var(--text-gold);">관리</div></th>`;
            }
        }

        function renderBody() {
            const tbody = document.getElementById('tableBody');
            if (!tbody) return;
            tbody.innerHTML = '';
            const cols = getCurrentColumns();

            membersData.forEach((m, idx) => {
                const tr = document.createElement('tr');
                let html = `
                    <td>
                        <div class="td-box">
                            <div class="profile-wrap" onclick="${isEdit ? `triggerFile(${idx})` : ''}">
                                ${m.img ? `<img src="${m.img}">` : `<span>사진</span>`}
                            </div>
                            <input type="file" id="f-${idx}" class="file-input" accept="image/*" onchange="uploadImg(event, ${idx})">
                        </div>
                    </td>
                `;

                cols.forEach(col => {
                    const val = m[col.id] || "";
                    const isName = (col.id === 'c1');
                    const isJob = (col.id === 'c2');
                    
                    if (isJob) {
                        let optionsHtml = '';
                        let hasMatched = false;
                        JOB_LIST.forEach(j => {
                            const selected = (val === j) ? 'selected' : '';
                            if (selected) hasMatched = true;
                            optionsHtml += `<option value="${j}" ${selected}>${j}</option>`;
                        });
                        if (!hasMatched && val) {
                            optionsHtml = `<option value="${val}" selected>${val}</option>` + optionsHtml;
                        }

                        html += `
                            <td>
                                <div class="td-box job-tag ${getJobClass(val)}">
                                    <select class="job-select" data-colid="${col.id}" ${!isEdit ? 'disabled' : ''} onchange="handleJobChange(this)">
                                        ${optionsHtml}
                                    </select>
                                </div>
                            </td>
                        `;
                    } else {
                        html += `
                            <td>
                                <div class="td-box">
                                    <input type="text" data-colid="${col.id}" value="${val}" ${!isEdit ? 'readonly' : ''} style="${isName ? 'font-weight:bold;' : ''}">
                                </div>
                            </td>
                        `;
                    }
                });

                if (isEdit) {
                    html += `
                        <td>
                            <div class="td-box" style="padding:2px; border:none; background:transparent;">
                                <div class="btn-action-group">
                                    <button class="btn-move" onclick="moveRow(${idx}, -1)">▲</button>
                                    <button class="btn-move" onclick="moveRow(${idx}, 1)">▼</button>
                                    <button class="btn-del" onclick="delRow(${idx})">삭제</button>
                                </div>
                            </div>
                        </td>
                    `;
                }

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        function triggerFile(idx) { document.getElementById(`f-${idx}`).click(); }
        function uploadImg(e, idx) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                membersData[idx].img = evt.target.result;
                renderBody();
            };
            reader.readAsDataURL(file);
        }

        function addRow() {
            if (!isEdit) return;
            syncInputsToData();
            let newObj = { img: "", c1: "새팀원", c2: "미정", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "", i1: "0", i2: "0", i3: "0", i4: "0", i5: "-", i6: "-", i7: "" };
            membersData.push(newObj);
            renderBody();
        }

        function delRow(idx) {
            if (!isEdit) return;
            if (confirm("해당 팀원을 삭제하시겠습니까?")) {
                syncInputsToData();
                membersData.splice(idx, 1);
                renderBody();
            }
        }

        function addColumn() {
            if (!isEdit || (activeTab !== 'spec' && activeTab !== 'item')) return;
            syncInputsToData();
            const title = prompt("새로 추가할 항목(열)의 이름을 입력하세요:", "새 항목");
            if (!title) return;

            const cols = getCurrentColumns();
            const newId = (activeTab === 'spec' ? 'c_' : 'i_') + Date.now();
            cols.push({ id: newId, title: title.trim(), width: "90px" });

            membersData.forEach(m => {
                if (m[newId] === undefined) m[newId] = "";
            });

            renderAll();
        }

        function delColumn(colId) {
            if (!isEdit) return;
            if (confirm("이 항목(열) 전체를 삭제하시겠습니까?")) {
                syncInputsToData();
                if (activeTab === 'spec') {
                    specColumns = specColumns.filter(c => c.id !== colId);
                } else {
                    itemColumns = itemColumns.filter(c => c.id !== colId);
                }
                renderAll();
            }
        }

        function moveColumn(colIdx, dir) {
            if (!isEdit) return;
            syncInputsToData();
            const cols = getCurrentColumns();
            const targetIdx = colIdx + dir;
            if (targetIdx < 0 || targetIdx >= cols.length) return;
            const temp = cols[colIdx];
            cols[colIdx] = cols[targetIdx];
            cols[targetIdx] = temp;
            renderAll();
        }

        function moveRow(idx, dir) {
            if (!isEdit) return;
            syncInputsToData();
            const targetIdx = idx + dir;
            if (targetIdx < 0 || targetIdx >= membersData.length) return;
            const temp = membersData[idx];
            membersData[idx] = membersData[targetIdx];
            membersData[targetIdx] = temp;
            renderBody();
        }

        function getJobClass(jobText) {
            if (!jobText) return 'job-default';
            const val = jobText.trim();
            if (val.includes('나이트')) return 'job-knight';
            if (val.includes('위자드')) return 'job-wizard';
            if (val.includes('워리어')) return 'job-warrior';
            if (val.includes('어쌔신')) return 'job-assassin';
            if (val.includes('헌터')) return 'job-hunter';
            return 'job-default';
        }

        function handleJobChange(selectElem) {
            const tdBox = selectElem.closest('.td-box');
            if (tdBox) {
                tdBox.className = 'td-box job-tag ' + getJobClass(selectElem.value);
            }
        }

        function saveData() {
            syncInputsToData();
            const dataToSave = {
                specColumns: specColumns,
                itemColumns: itemColumns,
                membersData: membersData,
                mapImages: mapImages,
                hiddenJobsData: hiddenJobsData,
                customTabs: customTabs
            };

            const dbRefInstance = window.dbRef(window.db, 'kimteam_board');
            window.dbSet(dbRefInstance, dataToSave)
                .then(() => {
                    alert("성공적으로 저장(실시간 동기화)되었습니다!");
                })
                .catch((error) => {
                    alert("저장 실패: " + error.message);
                });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const dbRefInstance = window.dbRef(window.db, 'kimteam_board');
            window.dbOnValue(dbRefInstance, (snapshot) => {
                const serverData = snapshot.val();
                if (serverData) {
                    if (serverData.specColumns) specColumns = serverData.specColumns;
                    if (serverData.itemColumns) itemColumns = serverData.itemColumns;
                    if (serverData.membersData) membersData = serverData.membersData;
                    if (serverData.mapImages) mapImages = serverData.mapImages;
                    if (serverData.hiddenJobsData) hiddenJobsData = serverData.hiddenJobsData;
                    if (serverData.customTabs) customTabs = serverData.customTabs;
                    renderAll();
                }
            });
            renderAll();
        });
    </script>
</body>
</html>
